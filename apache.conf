<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # API (mayúscula y minúscula)
    Alias /API /var/www/html/API
    Alias /api /var/www/html/API

    <Directory /var/www/html/API>
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    # ✅ No tocar llamadas a la API (mayúscula o minúscula)
    RewriteCond %{REQUEST_URI} ^/(API|api)/ [NC]
    RewriteRule .* - [L]

    # ✅ No reescribir estáticos
    RewriteCond %{REQUEST_URI} \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ [NC]
    RewriteRule .* - [L]

    # ✅ Si existe archivo/carpeta, servirlo normal
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule .* - [L]

    # ✅ SPA fallback
    RewriteRule .* /index.html [L]
</VirtualHost>
