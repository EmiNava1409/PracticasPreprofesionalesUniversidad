<section class="page-card">

  <div class="page-card-header">
    <h2>Gestión de Áreas</h2>
  </div>

  <div class="page-card-body">



    <!-- BÚSQUEDA Y BOTÓN -->
    <div class="search-row">
      <label>Búsqueda</label>

      <input
        type="text"
        class="search-input"
        placeholder="Buscar por nombre o departamento"
        [(ngModel)]="nombreBusqueda"
      />

      <button class="btn-search" (click)="filtrarAreas()">
        Buscar →
      </button>

      <button class="btn-blue" (click)="abrirModalNueva()">
        Agregar Área ⊕
      </button>
    </div>

    <!-- TABLA -->
    <table class="table-area">
      <thead>
        <tr>
          <th>ID Área</th>
          <th>Nombre</th>
          <th>ID Subárea</th>
          <th>Departamento</th>
          <th>ID Sede</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let area of areas">
          <td>{{ area.area_id }}</td>
          <td>{{ area.nombre }}</td>
          <td>{{ area.id_sub_area || '-' }}</td>
          <td>{{ area.departamento }}</td>
          <td>{{ area.id_sede }}</td>
          <td>
            <button class="btn-small blue" (click)="abrirModalEditar(area)">Editar</button>
            <button class="btn-small red" (click)="eliminarArea(area.area_id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>
</section>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Gestión de Áreas</h3>
    </div>

    <form class="modal-body" (ngSubmit)="guardarArea()">

      <div class="form-group">
        <label>Nombre</label>
        <input
          type="text"
          [(ngModel)]="nuevaArea.nombre"
          name="nombre"
          required
        />
      </div>

      <div class="form-group">
        <label>ID Subárea</label>
        <input
          type="number"
          [(ngModel)]="nuevaArea.id_sub_area"
          name="id_sub_area"
        />
      </div>

      <div class="form-group">
        <label>Departamento</label>
        <input
          type="text"
          [(ngModel)]="nuevaArea.departamento"
          name="departamento"
          required
        />
      </div>

      <div class="form-group">
        <label>ID Sede</label>
        <input
          type="number"
          [(ngModel)]="nuevaArea.id_sede"
          name="id_sede"
          required
        />
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn-blue">
          {{ editando ? 'Actualizar Área ⟲' : 'Agregar Área ⊕' }}
        </button>
        <button type="button" class="btn-light" (click)="cerrarModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
